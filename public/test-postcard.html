<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <title>Test Carte Postale</title>

    <link rel="stylesheet" href="/components/Postcard/Postcard.css">

</head>

<body style="background:#ece2c9; padding:40px;">

   <div id="postcard" class="postcard">

    <div class="postcard-inner">

        <!-- ========================= -->
        <!-- RECTO                     -->
        <!-- ========================= -->

        <section class="postcard-front">

            <div class="postcard-image">

                <img
                    src="/assets/images/postcards/france/bordeaux_1908.png"
                    alt="Carte postale ancienne">

            </div>

            <footer class="postcard-footer">

                <h2>CARTE POSTALE</h2>

                <p>Bordeaux • 1908</p>

            </footer>

        </section>

        <!-- ========================= -->
        <!-- VERSO                     -->
        <!-- ========================= -->

        <section class="postcard-back">

            <div class="postcard-header">

                Aujourd'hui je remercie...

            </div>

            <textarea
                class="gratitude-text"
                placeholder="Écris ici ce qui a illuminé ta journée..."></textarea>

            <div class="postcard-bottom">

                <div class="signature">

                    Signature

                </div>

                <div class="stamp">

                </div>

            </div>

        </section>

    </div>

</div>

</body>

</html>
