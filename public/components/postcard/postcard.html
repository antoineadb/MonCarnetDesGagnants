<div id="postcard" class="postcard">

    <div class="postcard-inner">

        <!-- ========================= -->
        <!-- RECTO                     -->
        <!-- ========================= -->

        <section class="postcard-front">

            <div class="postcard-image">

                <img
                    src="/assets/images/postcards/france/bordeaux_1908.png"
                    alt="Carte postale ancienne">

            </div>

            <footer class="postcard-footer">

                <h2>CARTE POSTALE</h2>

                <p>Bordeaux • 1908</p>

            </footer>

        </section>

        <!-- ========================= -->
        <!-- VERSO                     -->
        <!-- ========================= -->

        <section class="postcard-back">

        <div class="postcard-header">

            Aujourd'hui je remercie...

        </div>

        <div class="gratitude-editor">

            <input
                id="gratitudeTitle"
                class="gratitude-title"
                type="text"
                maxlength="60"
                placeholder="Titre de votre gratitude">

            <textarea
                id="gratitudeMessage"
                class="gratitude-text"
                placeholder="Écris ici ce qui a illuminé ta journée...">
            </textarea>

        </div>

        <button
            id="saveGratitude"
            class="postcard-save">

            📮 Déposer dans le coffre

        </button>

        <div class="postcard-bottom">

            <div class="signature">

                Signature

            </div>

            <div class="stamp"></div>

        </div>

    </section>

    </div>

</div>
