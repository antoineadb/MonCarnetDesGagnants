<div id="postcard" class="postcard">

    <div class="postcard-inner">

        <!-- ========================= -->
        <!-- RECTO                     -->
        <!-- ========================= -->

        <section class="postcard-front">

            <div class="postcard-image">

                <img
                    src="/assets/images/postcards/france/bordeaux_1908.png"
                    alt="Carte postale ancienne">

            </div>

            <footer class="postcard-footer">

                <h2>CARTE POSTALE</h2>

                <p>Bordeaux • 1908</p>

            </footer>

        </section>

        <!-- ========================= -->
        <!-- VERSO                     -->
        <!-- ========================= -->

        <section class="postcard-back">

            <!-- ================================= -->
            <!-- MODE ÉDITION                      -->
            <!-- ================================= -->

            <div
                id="gratitudeEditor"
                class="gratitude-editor">

                <textarea
                    id="gratitudeTitle"
                    class="gratitude-title"
                    type="text"
                    maxlength="60"
                    placeholder="Titre de votre gratitude"
                ></textarea>

                <textarea
                    id="gratitudeMessage"
                    class="gratitude-text"
                    placeholder="Écris ici ce qui a illuminé ta journée..."></textarea>

            </div>

            <!-- ================================= -->
            <!-- MODE LECTURE                      -->
            <!-- ================================= -->

            <div
                id="gratitudeReader"
                class="gratitude-reader hidden">

                <h2 id="gratitudeTitleView"></h2>

                <div id="gratitudeMessageView"></div>

            </div>

            <!-- ================================= -->
            <!-- ACTIONS ÉDITION                   -->
            <!-- ================================= -->

            <div
                id="postcardActionsEdit"
                class="postcard-actions-edit">

                <button
                    id="saveGratitude"
                    class="postcard-save">

                    📮 Déposer

                </button>

                <button
                    id="cancelEdit"
                    class="postcard-cancel">

                    ↩ Annuler

                </button>

            </div>

            <!-- ================================= -->
            <!-- ACTIONS LECTURE                   -->
            <!-- ================================= -->

            <div
                id="postcardActionsView"
                class="postcard-actions-view hidden">

                <button id="favoriteCard">

                    ⭐ Favori

                </button>

                <button id="editCard">

                    ✏ Modifier

                </button>

                <button id="deleteCard">

                   🗝 Retirer

                </button>

            </div>

        </section>       

    </div>

</div>
