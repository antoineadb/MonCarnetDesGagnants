<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gratitude</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/toast.css">
    <link rel="stylesheet" href="../css/confirm.css">
    <link rel="stylesheet" href="../css/gratitude.css">

</head>

<body>


<section class="chapter-page">

    <button
        type="button"
        class="btn-retour-carnet"
    >
        <i class="bi bi-arrow-left"></i>
        Retour
    </button>
    

    <div class="chapter-header">
        <h1 class="chapter-title">Gratitude</h1>

        <div class="chapter-line"></div>

        <p class="chapter-quote">
            « Le bonheur grandit lorsque l'on apprend à remercier la vie. »
        </p>

    </div>

    <div class="gratitude-scene">

        <h1>📚 La Bibliothèque de Gratitude</h1>

        <p class="gratitude-subtitle">
            Les petits bonheurs méritent une place dans notre mémoire.
        </p>


        <div class="gratitude-library">

            <div class="library-top">
                <span>MES SOUVENIRS</span>
            </div>


            <!-- ÉTAGÈRE 1 -->
            <div class="library-shelf">

                <div class="library-books">
                    <span class="book book-brown"></span>
                    <span class="book book-green"></span>
                    <span class="book book-red"></span>
                </div>

                <div
                    class="library-cards"
                    id="gratitudeLibraryCards1"
                ></div>

            </div>


            <!-- ÉTAGÈRE 2 -->
            <div class="library-shelf">

                <div class="library-books">
                    <span class="book book-dark"></span>
                    <span class="book book-gold"></span>
                </div>

                <div
                    class="library-cards"
                    id="gratitudeLibraryCards2"
                ></div>

            </div>


            <!-- ÉTAGÈRE 3 -->
            <div class="library-shelf">

                <div class="library-books">
                    <span class="book book-red"></span>
                    <span class="book book-brown"></span>
                </div>

                <div
                    class="library-cards"
                    id="gratitudeLibraryCards3"
                ></div>

            </div>

        </div>


        <div class="gratitude-library-summary">

            <div class="gratitude-count">

                <span class="gratitude-count-icon">💌</span>

                <div>

                    <strong id="gratitudeCount">
                        0
                    </strong>

                    <span>
                        souvenirs conservés
                    </span>

                </div>

            </div>


            <button
                type="button"
                id="btnVoirToutesCartes"
                class="library-button library-button-dark"
            >
                📖 Voir toutes mes cartes
            </button>


            <button
                type="button"
                id="btnAjouterGratitude"
                class="library-button"
            >
                ✒️ Ajouter une pensée
            </button>

        </div>


        <!-- Galerie existante -->
        <div id="gratitudeCards" class="gratitude-all-cards hidden" ></div>

        <!-- Formulaire existant -->
        <div id="gratitudePostcard"></div>

    </div>
    
    <div id="gratitudeViewerContainer"></div>

    <footer class="chapter-footer">

    <span class="chapter-book">
        Le Carnet des Gagnants
    </span>

    <span class="chapter-page-number">
        Page 3
    </span>

</footer>

</section>
<script src="/js/confirm.js"></script>
<script type="module" src="/js/gratitude.js"></script>
<script src="/js/toast.js"></script>
