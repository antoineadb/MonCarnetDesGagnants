<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Méditations & Bien-être — Le Carnet des Gagnants</title>

    <link rel="stylesheet" href="../css/meditations.css">
    <link rel="stylesheet" href="../css/toast.css">
    <link rel="stylesheet" href="../css/confirm.css">

</head>

<body>

<main class="meditation-page">

    <!-- =====================================================
         RETOUR
    ====================================================== -->

    <button
        type="button"
        id="backToHome"
        class="meditation-back-button">

        ← Retour à l'accueil

    </button>


    <!-- =====================================================
         EN-TÊTE
    ====================================================== -->

    <header class="meditation-header">

        <div class="meditation-symbol">
            🧘‍♂️
        </div>

        <h1>
            Méditations & Bien-être
        </h1>

        <p>
            Prendre soin de soi, un moment après l'autre.
        </p>

    </header>


    <!-- =====================================================
         CALENDRIER
    ====================================================== -->

    <section class="meditation-calendar-section">

        <div class="calendar-navigation">

            <button
                type="button"
                id="previousMonth"
                class="calendar-button">

                ◀

            </button>


            <div>

                <h2 id="calendarMonth">
                    Août 2026
                </h2>

                <p id="calendarSubtitle">
                    Vos pratiques de bien-être
                </p>

            </div>


            <button
                type="button"
                id="nextMonth"
                class="calendar-button">

                ▶

            </button>

        </div>


        <!-- Jours de la semaine -->

        <div
            id="calendarWeekdays"
            class="calendar-weekdays">

            <div>Lun</div>
            <div>Mar</div>
            <div>Mer</div>
            <div>Jeu</div>
            <div>Ven</div>
            <div>Sam</div>
            <div>Dim</div>

        </div>


        <!-- Cases du calendrier -->

        <div
            id="meditationCalendar"
            class="meditation-calendar">

        </div>

    </section>


    <!-- =====================================================
         JOUR SÉLECTIONNÉ
    ====================================================== -->

    <section
        id="selectedDay"
        class="selected-day"
        hidden>

        <div class="selected-day-header">

            <span class="selected-day-icon">
                🪷
            </span>

            <div>

                <h2 id="selectedDayTitle">
                    Journée
                </h2>

                <p id="selectedDaySubtitle">
                    Vos pratiques de bien-être
                </p>

            </div>

        </div>


        <!-- Liste des pratiques -->

        <div
            id="meditationPractices"
            class="meditation-practices">

        </div>


        <!-- Ajouter une pratique -->

        <button
            type="button"
            id="addMeditationButton"
            class="primary-button">

            ＋ Ajouter une pratique

        </button>

    </section>


    <!-- =====================================================
         POPUP — NOUVELLE PRATIQUE
    ====================================================== -->

    <div
        id="meditationModal"
        class="meditation-modal"
        hidden>

        <div class="meditation-modal-overlay"></div>


        <section class="meditation-form-section">

            <div class="meditation-form-header">

                <div class="meditation-form-icon">
                    🧘‍♂️
                </div>

                <div>

                    <h2>
                        Nouvelle pratique
                    </h2>

                    <p>
                        Notez ce moment consacré à votre bien-être.
                    </p>

                </div>

            </div>


            <!-- =================================================
                 FORMULAIRE
            ================================================== -->

            <form id="meditationForm">


                <!-- Date -->

                <div class="form-group">

                    <label for="meditationDate">
                        📅 Date
                    </label>

                    <input
                        type="date"
                        id="meditationDate"
                        name="meditation_date"
                        required>

                </div>


                <!-- Heure -->

                <div class="form-group">

                    <label for="meditationTime">
                        🕐 Heure
                    </label>

                    <input
                        type="time"
                        id="meditationTime"
                        name="meditation_time">

                </div>


                <!-- Type -->

                <div class="form-group">

                    <label for="meditationType">
                        🌿 Type de pratique
                    </label>

                    <select
                        id="meditationType"
                        name="type_id"
                        required>

                        <option value="">
                            Choisissez une pratique...
                        </option>

                    </select>

                </div>


                <!-- Durée -->

                <div class="form-group">

                    <label for="meditationDuration">
                        ⏱️ Durée
                    </label>

                    <div class="input-with-unit">

                        <input
                            type="number"
                            id="meditationDuration"
                            name="duration"
                            min="0"
                            placeholder="30">

                        <span>
                            minutes
                        </span>

                    </div>

                </div>


                <!-- Notes -->

                <div class="form-group">

                    <label for="meditationNotes">
                        📝 Notes
                    </label>

                    <textarea
                        id="meditationNotes"
                        name="notes"
                        rows="4"
                        placeholder="Comment s'est passée votre pratique ?"></textarea>

                </div>


                <!-- Actions -->

                <div class="meditation-form-actions">

                    <button
                        type="button"
                        id="cancelMeditationButton"
                        class="secondary-button">

                        Annuler

                    </button>


                    <button
                        type="submit"
                        class="primary-button">

                        Enregistrer la pratique

                    </button>

                </div>

            </form>

        </section>

    </div>

</main>


<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script src="../js/navigation.js"></script>
<script src="../js/toast.js"></script>
<script src="../js/confirm.js"></script>
<script src="../js/meditations.js"></script>

</body>

</html>
