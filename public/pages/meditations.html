<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Méditations — Le Carnet des Gagnants</title>

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">

    <style>

        .construction-page {
            min-height: 100vh;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 40px;
            box-sizing: border-box;
        }

        .construction-icon {
            font-size: 100px;
            margin-bottom: 25px;
        }

        .construction-page h1 {
            font-family: "Cormorant Garamond", serif;
            font-size: 48px;
            margin: 0 0 15px;
        }

        .construction-page p {
            font-size: 19px;
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto 30px;
        }

        .construction-page .subtitle {
            font-size: 16px;
            opacity: .7;
        }

        .btn-retour {
            display: inline-block;

            padding: 12px 26px;

            border-radius: 25px;
            border: none;

            background: #8d261c;
            color: white;

            font-size: 16px;
            cursor: pointer;

            text-decoration: none;
        }

        .btn-retour:hover {
            transform: translateY(-2px);
        }

    </style>

</head>

<body>

    <main class="construction-page">

        <div class="construction-icon">
            🏗️
        </div>

        <h1>🧘 Méditations</h1>

        <p>
            Cette nouvelle partie du Carnet des Gagnants
            est actuellement en construction.
        </p>

        <p class="subtitle">
            Elle sera bientôt disponible… ✨
        </p>

        <a href="app.html" class="btn-retour">
            ← Retour au Carnet
        </a>

    </main>

</body>

</html>
