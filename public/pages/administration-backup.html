<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Sauvegardes — Le Carnet des Gagnants
    </title>

    <link
        rel="stylesheet"
        href="/css/administration.css"
    >

    <link
        rel="stylesheet"
        href="/css/administration-statistics.css"
    >

</head>


<body>

<div class="statistics-page">

    <!-- =====================================================
         EN-TÊTE
         ===================================================== -->

    <header class="statistics-header">

        <button
            type="button"
            id="btnRetour"
            class="statistics-back"
        >
            ← Retour
        </button>

        <div class="statistics-header-title">

            <span>💾</span>

            <h1>
                Sauvegardes
            </h1>

        </div>

        <div></div>

    </header>


    <!-- =====================================================
         CONTENU
         ===================================================== -->

    <main class="statistics-main">

        <section class="statistics-section">

            <div class="statistics-section-title">

                <span>🛡️</span>

                <h2>
                    Sauvegarde du Carnet
                </h2>

            </div>


            

        </section>

    </main>

<div class="statistics-placeholder">

    <div class="statistics-placeholder-icon">
        💾
    </div>

    <p>
        Sauvegardez l'intégralité de la base de données de votre Carnet.
    </p>

    <button
        type="button"
        id="btnBackup"
        class="statistics-back"
    >
        💾 Créer une sauvegarde
    </button>

    <p
        id="backupMessage"
        style="display:none;"
    ></p>

</div>


<!-- =====================================================
     HISTORIQUE DES SAUVEGARDES
     ===================================================== -->

<section class="statistics-section">

    <div class="statistics-section-title">

        <span>📋</span>

        <h2>
            Historique des sauvegardes
        </h2>

    </div>

    <div
        id="backupHistory"
        class="backup-history"
    >

        <div class="statistics-chart-loading">
            Chargement de l'historique…
        </div>

    </div>

</section>
    <!-- =====================================================
         PIED DE PAGE
         ===================================================== -->

    <footer class="statistics-footer">

        <span>✦</span>

        <span>
            Le Carnet des Gagnants
        </span>

        <span>✦</span>

    </footer>

</div>

    <script>

    document.addEventListener(
        "DOMContentLoaded",
        () => {

            // =========================================
            // RETOUR
            // =========================================

            const btnRetour =
                document.getElementById("btnRetour");

            if (btnRetour) {

                btnRetour.addEventListener(
                    "click",
                    () => {

                        window.location.href =
                            "administration.html";

                    }
                );

            }
            // =========================================
            // HISTORIQUE DES SAUVEGARDES
            // =========================================

            const backupHistory =
                document.getElementById("backupHistory");


            async function chargerHistorique() {

                try {

                    const response =
                        await fetch("/api/admin/backup-history");


                    if (!response.ok) {

                        throw new Error(
                            "Impossible de charger l'historique."
                        );

                    }


                    const data =
                        await response.json();


                    if (
                        !data.success ||
                        !data.backups.length
                    ) {

                        backupHistory.innerHTML = `
                            <div class="backup-history-empty">
                                Aucune sauvegarde enregistrée.
                            </div>
                        `;

                        return;

                    }


                    backupHistory.innerHTML = `

                        <div class="backup-history-header">

                            <span>Date</span>
                            <span>Fichier</span>
                            <span>Taille</span>
                            <span>Statut</span>

                        </div>

                        ${data.backups.map(backup => {

                            const date =
                                new Date(
                                    backup.created_at
                                ).toLocaleString(
                                    "fr-FR",
                                    {
                                        day: "2-digit",
                                        month: "2-digit",
                                        year: "numeric",
                                        hour: "2-digit",
                                        minute: "2-digit"
                                    }
                                );


                            const taille =
                                backup.size
                                    ? (
                                        backup.size / 1024
                                      ).toFixed(1) + " Ko"
                                    : "—";


                            const statut =
                                backup.status === "OK"
                                    ? "✓ OK"
                                    : "✕ KO";


                            return `

                                <div class="backup-history-row">

                                    <span>
                                        ${date}
                                    </span>

                                    <span>
                                        ${backup.filename}
                                    </span>

                                    <span>
                                        ${taille}
                                    </span>

                                    <span class="${
                                        backup.status === "OK"
                                            ? "backup-status-ok"
                                            : "backup-status-ko"
                                    }">
                                        ${statut}
                                    </span>

                                </div>

                            `;

                        }).join("")}

                    `;

                }

                catch (error) {

                    console.error(
                        "Erreur historique sauvegardes :",
                        error
                    );


                    backupHistory.innerHTML = `
                        <div class="backup-history-empty">
                            Impossible de charger l'historique.
                        </div>
                    `;

                }

            }


            chargerHistorique();

            // =========================================
            // SAUVEGARDE
            // =========================================

            const btnBackup =
                document.getElementById("btnBackup");

            const backupMessage =
                document.getElementById("backupMessage");


            if (btnBackup) {

                btnBackup.addEventListener(
                    "click",
                    async () => {

                        btnBackup.disabled = true;

                        btnBackup.textContent =
                            "⏳ Création de la sauvegarde...";


                        try {

                            const response =
                                await fetch("/api/admin/backup");


                            if (!response.ok) {

                                throw new Error(
                                    "Erreur lors de la sauvegarde."
                                );

                            }


                            const blob =
                                await response.blob();


                            // =================================
                            // Récupération du nom du fichier
                            // =================================

                            const disposition =
                                response.headers.get(
                                    "Content-Disposition"
                                );

                            let filename =
                                "carnet-sauvegarde.db";


                            if (disposition) {

                                const match =
                                    disposition.match(
                                        /filename="?([^"]+)"?/i
                                    );

                                if (match && match[1]) {

                                    filename =
                                        match[1];

                                }

                            }


                            // =================================
                            // Téléchargement
                            // =================================

                            const url =
                                window.URL.createObjectURL(blob);

                            const link =
                                document.createElement("a");

                            link.href = url;

                            link.download =
                                filename;

                            document.body.appendChild(link);

                            link.click();

                            link.remove();

                            window.URL.revokeObjectURL(url);


                            // =================================
                            // Message
                            // =================================

                            backupMessage.textContent =
                                "✓ Sauvegarde créée avec succès.";

                            await chargerHistorique();

                            backupMessage.style.display =
                                "block";

                            backupMessage.style.color =
                                "#6F8064";


                        } catch (error) {

                            console.error(
                                "Erreur sauvegarde :",
                                error
                            );


                            backupMessage.textContent =
                                "❌ Impossible de créer la sauvegarde.";

                            backupMessage.style.display =
                                "block";

                            backupMessage.style.color =
                                "#9A5A4A";

                        }


                        btnBackup.disabled =
                            false;

                        btnBackup.textContent =
                            "💾 Créer une sauvegarde";

                    }

                );

            }

        }
    );

    </script>

</body>

</html>
