<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catégories - Objectifs - Le Cahier des Gagnants</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <!-- CSS communs -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/confirm.css">
    <!-- CSS de la page -->
    <link rel="stylesheet" href="../css/categories-objectifs.css">

    
</head>

<body>

    <main class="categories-page">

        <!-- Retour -->
        <div class="categories-back">

            <a href="objectifs.html">
                ← Retour aux objectifs
            </a>

        </div>


        <!-- En-tête -->
        <header class="categories-header">

            <div class="categories-chapter">
                Chapitre I
            </div>

            <h1>
                Mes domaines
            </h1>

            <div class="categories-line"></div>

            <p class="categories-subtitle">
                Les différents chemins qui donnent forme à tes objectifs.
            </p>

        </header>


        <!-- Collection de catégories -->
        <section class="categories-collection">

            <!-- Catégorie 1 -->
            <article class="category-papyrus">

                <div class="category-symbol">
                    𓌸𓂋𓅱𓏏𓀁
                </div>

                <div class="category-egyptian">
                    MRW.T
                </div>

                <h2>
                    Relations
                </h2>

                <div class="category-actions">

                    <button
                        type="button"
                        class="category-action edit"
                        title="Modifier"
                    >
                        ✎
                    </button>

                    <button
                        type="button"
                        class="category-action delete"
                        title="Supprimer"
                    >
                        🗑
                    </button>

                </div>

            </article>


            <!-- Catégorie 2 -->
            <article class="category-papyrus">

                <div class="category-symbol">
                    𓅱𓍑𓄿𓏛
                </div>

                <div class="category-egyptian">
                    WḎꜢ
                </div>

                <h2>
                    Épanouissement
                </h2>

                <div class="category-actions">

                    <button
                        type="button"
                        class="category-action edit"
                        title="Modifier"
                    >
                        ✎
                    </button>

                    <button
                        type="button"
                        class="category-action delete"
                        title="Supprimer"
                    >
                        🗑
                    </button>

                </div>

            </article>


            <!-- Catégorie 3 -->
            <article class="category-papyrus">

                <div class="category-symbol">
                    𓂓𓏏𓀋
                </div>

                <div class="category-egyptian">
                    Kꜣ.T
                </div>

                <h2>
                    Travail & Projets
                </h2>

                <div class="category-actions">

                    <button
                        type="button"
                        class="category-action edit"
                        title="Modifier"
                    >
                        ✎
                    </button>

                    <button
                        type="button"
                        class="category-action delete"
                        title="Supprimer"
                    >
                        🗑
                    </button>

                </div>

            </article>


            <!-- Ajouter -->
            <button
                type="button"
                class="new-category-papyrus"
            >

                <span class="new-category-symbol">
                    +
                </span>

                <span class="new-category-title">
                    Nouvelle catégorie
                </span>

                <span class="new-category-text">
                    Écrire un nouveau domaine
                </span>

            </button>

        </section>


        <!-- Pied de page -->
        <footer class="categories-footer">

            <span>
                Le Cahier des Gagnants
            </span>

            <span>
                Objectifs
            </span>

        </footer>
        <script src="../js/confirm.js"></script>
        <script src="../js/categories-objectifs.js"></script>

    </main>

</body>

</html>
